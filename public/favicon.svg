<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e0c1f"/>
      <stop offset="1" stop-color="#0b1228"/>
    </linearGradient>
    <linearGradient id="ic" x1="9" y1="9" x2="51" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="60" height="60" rx="12" fill="url(#bg)"/>
  <rect width="60" height="60" rx="12" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Dotted staircase icon, centered in a 60×60 canvas -->
  <!-- 5 columns at x=9,18,27,36,45; dots stacked from y=51 upward -->
  <!-- col 1 — 5 dots -->
  <circle cx="9"  cy="51" r="3" fill="url(#ic)"/>
  <circle cx="9"  cy="42" r="3" fill="url(#ic)" opacity=".90"/>
  <circle cx="9"  cy="33" r="3" fill="url(#ic)" opacity=".78"/>
  <circle cx="9"  cy="24" r="3" fill="url(#ic)" opacity=".62"/>
  <circle cx="9"  cy="15" r="3" fill="url(#ic)" opacity=".44"/>
  <!-- col 2 — 4 dots -->
  <circle cx="18" cy="51" r="3" fill="url(#ic)"/>
  <circle cx="18" cy="42" r="3" fill="url(#ic)" opacity=".90"/>
  <circle cx="18" cy="33" r="3" fill="url(#ic)" opacity=".78"/>
  <circle cx="18" cy="24" r="3" fill="url(#ic)" opacity=".62"/>
  <!-- col 3 — 3 dots -->
  <circle cx="27" cy="51" r="3" fill="url(#ic)"/>
  <circle cx="27" cy="42" r="3" fill="url(#ic)" opacity=".90"/>
  <circle cx="27" cy="33" r="3" fill="url(#ic)" opacity=".78"/>
  <!-- col 4 — 2 dots -->
  <circle cx="36" cy="51" r="3" fill="url(#ic)"/>
  <circle cx="36" cy="42" r="3" fill="url(#ic)" opacity=".90"/>
  <!-- col 5 — 1 dot -->
  <circle cx="45" cy="51" r="3" fill="url(#ic)"/>
</svg>
