# lodgely — local development & lightweight self-hosting stack.
# A single command (`docker compose up -d`) brings up:
#   - postgres 16     (data persisted in named volume)
#   - php-fpm app     (composer + node build run on first boot)
#   - queue worker    (database driver)
#   - scheduler       (runs due artisan schedule entries every minute)
#   - caddy           (TLS-ready reverse proxy / static file server)

name: lodgely

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lodgely}
      POSTGRES_USER: ${DB_USERNAME:-lodgely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lodgely}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lodgely} -d ${DB_DATABASE:-lodgely}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
    volumes:
      - .:/app
    working_dir: /app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - .:/app
    working_dir: /app

  # Laravel scheduler — without this container none of the recurring jobs
  # (Google Sheets fetch, IMAP pull, ad-metrics import, report emails,
  # GDPR purge) ever run. `schedule:work` invokes `schedule:run` every
  # minute in the foreground, which is exactly what cron would do.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/app
    working_dir: /app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${LODGELY_HTTP_PORT:-8080}:80"
      - "${LODGELY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - .:/app:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
