; Production-safe PHP defaults for lodgely. The official php images ship
; without a php.ini, which leaves expose_php and display_errors on.
;
; expose_php=Off      → no "X-Powered-By: PHP/8.4.x" on every response
; display_errors=Off  → errors raised before Laravel boots (or outside it)
;                       go to the log, never into the page
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; Session cookies are Laravel's job, but harden PHP's own in case anything
; ever calls session_start() directly.
session.use_strict_mode = 1
session.cookie_httponly = 1
